# Agentic Energy Lab: unit tests + evaluation gate, all in mock mode (free, no secrets).
# Runs only when files under agentic-energy-lab/ change.
name: agentic-energy-lab

on:
  push:
    paths: ["agentic-energy-lab/**", ".github/workflows/agentic-energy-lab.yml"]
  pull_request:
    paths: ["agentic-energy-lab/**", ".github/workflows/agentic-energy-lab.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: agentic-energy-lab

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agentic-energy-lab/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/00_make_data.py
      - run: python -m pytest -q
      - name: Evaluation gate (fails the build if quality drops below thresholds)
        run: python scripts/14_evaluate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: agentic-energy-lab/runs/eval_report.json
