# docker compose up --build api   -> the API on http://localhost:8000/docs
# docker compose up -d db         -> Postgres + pgvector for script 05 (PGVECTOR_URL in .env)
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab   # local demo only
      POSTGRES_DB: lab
    ports: ["5432:5432"]
